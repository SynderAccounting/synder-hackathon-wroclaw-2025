version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: synderhacks-postgres
    environment:
      - POSTGRES_USER=synderhacks
      - POSTGRES_PASSWORD=synderhacks_password
      - POSTGRES_DB=synderhacks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - synderhacks-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synderhacks"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synderhacks-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://synderhacks:synderhacks_password@postgres:5432/synderhacks
      - SECRET_KEY=production-secret-key-change-this
      - MODEL_PROVIDER=openai
      - MODEL_NAME=gpt-5-mini
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGSMITH_TRACING=true
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synderhacks-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synderhacks-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - synderhacks-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  amazon:
    build:
      context: ./mock_api
      dockerfile: services/amazon/Dockerfile
    container_name: mock-api-amazon
    ports:
      - "55000:55000"
    environment:
      - FLASK_ENV=production
    networks:
      - synderhacks-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:55000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  etsy:
    build:
      context: ./mock_api
      dockerfile: services/etsy/Dockerfile
    container_name: mock-api-etsy
    ports:
      - "55001:55000"
    environment:
      - FLASK_ENV=production
    networks:
      - synderhacks-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:55000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  shopify:
    build:
      context: ./mock_api
      dockerfile: services/shopify/Dockerfile
    container_name: mock-api-shopify
    ports:
      - "55002:55000"
    environment:
      - FLASK_ENV=production
    networks:
      - synderhacks-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:55000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  synderhacks-network:
    driver: bridge

volumes:
  postgres_data:
